<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - WORD QUEST</title>
    <link rel="icon" href="{{ url_for('static', filename='imgs/app-main-logo.png') }}">
    <noscript>
        <meta http-equiv="refresh" content="0; URL=../error/nojs.html">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/css/style-account-forms.css') }}">
</head>

<body>
    <section class="signup-form-container" id="signup-form-container">
        <form id="signup-form" method="POST" action="/auth/register" onsubmit="send_form(event)">
            <img src="{{ url_for('static', filename='imgs/app-main-logo.png') }}" alt="logo" class="logo">
            <h1>Inscription</h1>
            <div class="step-bar">
                <div class="step-bar-fill" style="width: 33%;"></div>
            </div>
            {% with messages = get_flashed_messages() %} {% if messages %}
            <p id="login-form-main-alert">{{ messages[0] }}</p>
            {% endif %} {% endwith %}
            <div id="front-alert"></div>
            <div class="parts-container">
                <div class="part-1">
                    <input type="text" name="name" class="name-input" id="signup-name-input" placeholder="Pseudo" required>
                    <input type="date" name="birthday" class="birthday-input" id="signup-birthday-input" max="2018-01-01" placeholder="Date de naissance" required>
                    <input type="email" name="email" class="email-input" id="signup-email-input" placeholder="Adresse e-mail" required>
                    <input type="password" name="password" class="password-input" id="signup-password-input" placeholder="Mot de passe" required>
                    <div class="conditions-container">
                        <p class="conditions">En cliquant sur "Inscription", vous acceptez les <a href="/conditions" class="conditions-link">conditions d'utilisation</a></p>
                        <div>
                            <input type="checkbox" name="conditions" id="conditions" class="conditions-checkbox" required>
                            <label for="conditions" class="toggle">
                                <span class="toggle-button"></span>
                            </label>
                        </div>
                    </div>
                    <span class="separator"></span>
                    <div class="submit-button" style="width: 100%; display:block;" onclick="changePage()">Continuer</div>
                </div>
                <div class="part-2">
                    <p class="title">Choisissez votre avatar</p>
                    <div class="pictures-container">
                        {% for i in range(1, 13) %}
                        <div>
                            <input type="radio" name="profile-picture" value="{{ i }}" id="profile-picture-{{ i }}" class="profile-picture-radio" {% if i==1 %}checked{% endif %} required>
                            <label for="profile-picture-{{ i }}">
                                <img src="/static/imgs/profiles/picture-{{ i }}.png" alt="profile-picture-{{ i }}" class="profile-picture">
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                    <span class="separator"></span>
                    <button type="submit" class="submit-button" id="signup-submit-button">Inscription</button>
                </div>
            </div>
        </form>
        <span class="separator snd-separator"></span>
        <div class="create-account-container">
            <a href="{{ url_for('auth.login') }}" class="create-account">J'ai déjà un compte</a>
        </div>
    </section>
    <script>
        function changePage() {
            const form = document.getElementById("signup-form");
            if (form.name.value === "" || form.birthday.value === "" || form.email.value === "" || form.password.value === "") {
                if (!document.getElementById("login-form-main-alert")) {
                    document.getElementById("front-alert").innerHTML = "<p id='login-form-main-alert'>Veuillez remplir tous les champs</p>";
                    return;
                } else {
                    document.getElementById("login-form-main-alert").innerHTML = "Veuillez remplir tous les champs";
                    return;
                }
            } else if (!form.conditions.checked) {
                if (!document.getElementById("login-form-main-alert")) {
                    document.getElementById("front-alert").innerHTML = "<p id='login-form-main-alert'>Veuillez accepter les conditions d'utilisation</p>";
                    return;
                } else {
                    document.getElementById("login-form-main-alert").innerHTML = "Veuillez accepter les conditions d'utilisation";
                    return;
                }
            }
            if (document.getElementById("login-form-main-alert")) {
                document.getElementById("login-form-main-alert").remove();
            }
            document.getElementsByClassName("step-bar-fill")[0].style.width = "66%";
            document.getElementsByClassName("part-1")[0].style.left = "-150%";
            document.getElementsByClassName("part-2")[0].style.left = "0";
        }

        function send_form(event) {
            event.preventDefault();
            document.getElementById("signup-submit-button").innerHTML = '<div class="loader"></div>';
            document.getElementById("signup-form").submit();
        }
    </script>
</body>

</html>
