<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du pendu | Word Quest</title>
    <link rel="stylesheet" href="/static/styles/games/hangman/main.css">
    <link rel="stylesheet" href="/static/styles/games/timer.css">
</head>
<body>
    <section id="begining" class="begining">
        <div>
            <p id="begin"></p>
        </div>
    </section>
    <div class="all">
        <button class="exit">
            <img src="/static/icons/games-icons/exit.png" alt="">
        </button>
        <section class="game">
            <div id="animation-xp" class="XP">
                <p id="xpnotif">+0</p>
                <img src="/static/icons/games-icons/big-flash.png" alt="">
            </div>
            <div class="bad-letter-content">
                Mauvaise Lettre
                <div id="bad-letter"></div>
                
            </div>
            <svg height="50vh" width="33vw" class=figure-content>

                <!-- Support-->
                <line x1="30%" y1="10%" x2="75%" y2="10%"/>
                <line x1="75%" y1="10%" x2="75%" y2="25%"/>
                <line x1="30%" y1="10%" x2="30%" y2="85%"/>
                <line x1="5%" y1="85%" x2="55%" y2="85%"/>

                <!--stickman-->
                <!--head-->
                <circle cx="75%" cy="34%" r="6%" class="figure-part"/>

                <!--body-->
                <line x1="75%" y1="42%" x2="75%" y2="62%" class="figure-part"/>

                <!--arms-->
                <line x1="75%" y1="50%" x2="65%" y2="45%" class="figure-part"/>
                <line x1="75%" y1="50%" x2="85%" y2="45%" class="figure-part"/>
                
                <!--legs-->
                <line x1="75%" y1="62%" x2="70%" y2="75%" class="figure-part"/>
                <line x1="75%" y1="62%" x2="80%" y2="75%" class="figure-part"/>
            </svg>
            
            <div class="word" id="word">
            </div>

        </section>
        <!--message final-->
        <div class="popup-content" id="popup-content">
            <div class="popup">
                <h2 id="final-message">Bravo tu as gagné !</h2>
                <button id="play-button">Rejouer !</button>
            </div>
            <p></p>
        </div>

        <!-- Notification-->
        <div class="notification-content" id="notification-content">
            
            <p>Vous avez déja essayé cette lettre !</p>
        </div>
        <span class="separation-line"></span>
        <section class="other">
            <h1>Indices</h1>
            <div class="indices">
                <div id="indice-container" class="container">
                </div>
                <button id="add-indice" class="new-indice-btn">
                    <img src="/static/icons/plus-30-white.png" alt="">
                </button>
            </div>
            
            <span class="separation-line2"></span>
            
            <div class="info-content">
                <div class="counter">
                    <img src="/static/icons/games-icons/flash.png" alt="">
                    <p id="xp">0Xp</p>
                </div>
                <div class="counter">
                    <img src="/static/icons/games-icons/timer-icon.png" alt="">
                    <p id="countdown-game"></p>
                </div>
            </div>
            
        </section>
        <section id="recap" class="recap">
            <h1 id="remarque">Bravo !</h1>
            <div class="stats">
                <div class="stats-xp">
                    <p>XP gagné:</p>
                    <div>
                        <p id="XP-final">+0XP</p>
                        <img src="/static/icons/games-icons/flash.png" alt="">
                    </div>
                </div>
                <div class="stats-word">
                    <p>Mots trouvé</p>
                    <p id="word-finded"></p>
                </div>
            </div>
            <div class="recap-btns">
                <button >Retour au menu</button>
                <button id="retry">Réessayer</button>
            </div>
        </section>
    </div>
    <script src="/static/styles/games/hangman/main.js"></script>
    <script src="/static/styles/games/timer.js"></script>
</body>
</html>
