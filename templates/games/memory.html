<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Word Quest</title>
    <link rel="icon" type="image/png" href="/static/imgs/app-main-logo.png" />
    <link rel="stylesheet" href="/static/styles/games/memory/main.css">
    <link rel="stylesheet" href="/static/styles/games/main.css">
</head>

<body data-session_id="{{session_id}}" data-list_id="{{list_id}}">
    <section id="begining" class="begining">
        <div>
            <p id="begin"></p>
        </div>
    </section>
    <section class="memories">
        <div class="container">
            <div class="rules">Trouve les doublets de mots anglais/francais !</div>
            <div id="game" class="game"></div>
            <span class="separation"></span>
            <div class="time">
                <img src="/static/icons/games-icons/timer-icon.png" class="icon" alt="">
                <div class="data" id="time">{{time}}</div>
            </div>
        </div>
    </section>

    {% set popUpTitle = "Memory" %} {% set popUpDesc = "Vous disposez de 2 minutes pour trouver les duos de motq Francais/ Anglais" %} {%set popUpGame = "memory"%} {% include "games/popups.html" %}
    <script src="/static/styles/games/memory/main.js"></script>
</body>

</html>
