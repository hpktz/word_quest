<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Word Quest</title>
    <link rel="icon" type="image/png" href="/static/imgs/app-main-logo.png" />
    <link rel="stylesheet" href="/static/styles/games/quiz/main.css">
    <link rel="stylesheet" href="/static/styles/games/main.css">
</head>

<body data-session_id="{{session_id}}" data-list_id="{{list_id}}">
    <section class="main-game-section">
        <a href="/dashboard" class="back">
            <img src="/static/icons/games-icons/exit.png" alt="">
        </a>
        <div class="content">
            <div class="header">
                <div class="time">
                    <img src="/static/icons/games-icons/timer-icon.png" class="icon" alt="">
                    <div class="data" id="data-time">{{time}}</div>
                </div>
                <div class="progress">
                    <div class="progress-inner" style="width: 10%;"></div>
                </div>
                <div class="score">
                    <span id="data-score">{{score}}</span> / {{max_score}}
                </div>
            </div>
            <div class="quiz-container">
                <div class="question" id="question">
                    {% include question %}
                </div>
                <div class="answers">
                    {% for answer in answers %}
                    <div class="answer" id="answer-1">{{answer}}</div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </section>
    {% set popUpTitle = "Quiz" %} {% set popUpDesc = "Vous disposez de 2 minutes pour répondre à un maximum de question" %} {%set popUpGame = "quiz"%} {% include "games/popups.html" %}
    <script>
        const session_id = document.body.dataset.session_id;

        async function play(element) {
            const audio = new Audio(element.dataset.audio_link);
            audio.play();
        }

        const answers = document.querySelectorAll('.answer');
        answers.forEach(answer => {
            answer.addEventListener('click', () => {
                check_answer(answer.id.split('-')[1]);
            });
        });

        async function check_answer(answer) {
            try {
                const response = await fetch(`/dashboard/games/quiz/${session_id}/check/${answer}`);
                const data = await response.json();
                if (data.code == 200) {
                    document.getElementById("question").innerHTML = data.result.html;
                    for (let i = 0; i < answers.length; i++) {
                        answers[i].innerHTML = data.result.answers[i];
                    }
                } else if (data.code == 201) {
                    end_game(data.result.xp, data.result.time, data.result.lost_lives);
                }
            } catch (error) {
                console.error(error);
                // window.location.href = '/dashbaord/errors/500';
            }
        }

        /**
         * 
         * This function is used to display the end pop-up
         * 
         * @param {Event} event - The event that triggered the function
         * 
         * @returns {void} - The result of the function
         */
        var timer = setInterval(async() => {
            // Get the time element
            const time = document.getElementById('data-time');
            // Decrease the time by 1
            time.innerHTML = parseInt(time.innerHTML) - 1;

            // If the timer is over
            if (time.textContent == 0) {
                clearInterval(timer);
                try {
                    // Check the status of the game
                    const response = await fetch(`/dashboard/games/quiz/${document.querySelector('body').dataset.session_id}/check_status`);
                    const data = await response.json();

                    // If the game is over
                    if (data.code == 201) {
                        // End the game
                        end_game(data.result.xp, data.result.time, data.result.lost_lives);
                    }
                } catch (error) {
                    window.location.href = '/dashboard/errors/500';
                }
            }
        }, 1000);

        timer;
    </script>
</body>

</html>
